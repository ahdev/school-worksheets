<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Worksheet Wizard – Fun Learning Worksheets</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #f7f9fc;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #4f8ef7, #6cc6ff);
            padding: 40px 20px;
            text-align: center;
            color: white;
        }

        header h1 {
            font-size: 48px;
            margin: 0;
            font-weight: 700;
        }

        header p {
            font-size: 20px;
            margin-top: 10px;
        }

        .subjects {
            max-width: 900px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding: 0 20px;
        }

        .subject-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
        }

        .subject-card h2 {
            margin: 0;
            font-size: 28px;
            color: #4f8ef7;
        }

        .subject-card p {
            margin: 12px 0 20px;
            font-size: 16px;
            color: #555;
        }

        .subject-card a {
            display: inline-block;
            padding: 10px 18px;
            background: #4f8ef7;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .subject-card a:hover {
            background: #3a6fd8;
        }

        footer {
            text-align: center;
            padding: 30px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>

<header>
    <h1>Worksheet Wizard</h1>
    <p>Fun, simple, and professional worksheets for young learners</p>
</header>

<section class="subjects">
    <!-- Math Subject Card -->
    <div class="subject-card">
        <h2>Math</h2>
        <p>Practice multiplication with customizable worksheets designed to build confidence.</p>
        <a href="math/mad-multiplication.html">Generate Worksheets</a>
    </div>

    <!-- Future subjects can be added here -->
</section>

<footer>
    © 2026 Worksheet Wizard — Making learning fun and easy
</footer>

</body>
</html>
